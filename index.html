<!doctype html>
<html lang="en">

    <meta name="theme-color" content="#080706" />

    <!-- PLACEHOLDER business details: keep in sync with src/content/site.ts -->
    <title>Ember &amp; Oak — Specialty Coffee, Crafted Slowly</title>
    <meta
      name="description"
      content="A specialty coffee house in Chennai. Carefully sourced beans, small-batch roasting, fresh pastries and slow mornings. Open daily from 7:00 AM."
    />
    <link rel="canonical" href="https://cafecaffeine.vercel.app/" />

    <meta property="og:type" content="website" />

      property="og:description"
      content="A place where exceptional coffee, slow mornings, and good conversations meet."
    />
    <meta property="og:url" content="https://cafecaffeine.vercel.app/" />
    <meta property="og:image" content="https://cafecaffeine.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ember & Oak café logo" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CafeOrCoffeeShop",
        "name": "Ember & Oak",
        "description": "Specialty coffee house. Carefully sourced beans, small-batch roasting, fresh pastries.",
        "url": "https://cafecaffeine.vercel.app/",
        "telephone": "+91 00000 00000",
        "email": "hello@example.com",
        "servesCuisine": "Coffee, Pastries",
        "priceRange": "₹₹",
        "image": "https://cafecaffeine.vercel.app/og.jpg",
        "logo": "https://cafecaffeine.vercel.app/icon-512.png",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "123 Coffee Street",
          "addressLocality": "Chennai",
          "addressRegion": "Tamil Nadu",
          "addressCountry": "IN"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "07:00",
            "closes": "22:30"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Saturday", "Sunday"],
            "opens": "08:00",
            "closes": "23:30"
          }
        ],
        "sameAs": ["https://www.instagram.com/", "https://www.facebook.com/"]
      }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
